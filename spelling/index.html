<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1a2b">
<meta name="apple-mobile-web-app-title" content="Reps">
<link rel="apple-touch-icon" href="icon.png">
<title>Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ea; --field:#e3ead9; --panel:#ffffff; --ink:#122033; --muted:#5b6878; --line:#d5dccf;
  --turf:#1f7a45; --turf-ink:#ffffff; --gold:#e8a317; --gold-ink:#2a1d00; --coral:#c8553d; --sky:#2f6fb0;
  --board:#0f1a2b; --board-ink:#f5f1e3; --board-dim:#93a0b4; --ok:#1f7a45; --bad:#c8553d;
  --shadow:0 2px 0 rgba(18,32,51,.08), 0 8px 24px rgba(18,32,51,.08);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b131f; --field:#101b2a; --panel:#152235; --ink:#eef2f7; --muted:#9fb0c4; --line:#24354d;
    --turf:#2ea862; --turf-ink:#06140b; --gold:#f2b632; --gold-ink:#211600; --coral:#ef7a62; --sky:#6aa8e8;
    --board:#060c15; --board-ink:#f5f1e3; --board-dim:#7f8da3; --ok:#3cc177; --bad:#ef7a62;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b131f; --field:#101b2a; --panel:#152235; --ink:#eef2f7; --muted:#9fb0c4; --line:#24354d;
  --turf:#2ea862; --turf-ink:#06140b; --gold:#f2b632; --gold-ink:#211600; --coral:#ef7a62; --sky:#6aa8e8;
  --board:#060c15; --board-ink:#f5f1e3; --board-dim:#7f8da3; --ok:#3cc177; --bad:#ef7a62;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Lexend", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:18px; line-height:1.4; -webkit-text-size-adjust:100%;
  overflow-x:hidden; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.plays{display:grid;gap:10px}
.play{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--field);display:grid;gap:6px}
.play .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play .rule{font-weight:600}
.play .ex{font-size:15px}
.play .ex s{color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.chip.focus{background:color-mix(in srgb,var(--gold) 30%,var(--panel));color:var(--ink)}
.chip.building{background:color-mix(in srgb,var(--sky) 22%,var(--panel));color:var(--ink)}
.chip.solid{background:color-mix(in srgb,var(--ok) 25%,var(--panel));color:var(--ink)}
.cloud{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cloud i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.cloud.on i{background:var(--ok)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{font-weight:800;letter-spacing:.02em;font-size:20px;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--turf);display:inline-block}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.iconbtn:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.board{background:var(--board);color:var(--board-ink);border-radius:20px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:2px dashed rgba(245,241,227,.12)}
.board .lab{color:var(--board-dim);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.money{font-variant-numeric:tabular-nums;font-weight:800}
.bankrow{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;align-items:end}
.bank-total{font-size:44px;line-height:1;color:var(--gold)}
.bank-sub{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(245,241,227,.07);border-radius:12px;padding:10px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h2{margin:0 0 10px;font-size:20px}
.card h3{margin:14px 0 8px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:14px;border:0;cursor:pointer;font-weight:700;font-size:19px;background:var(--turf);color:var(--turf-ink);box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sky{background:var(--sky);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 160px}
.drills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:12px;padding:8px;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;gap:2px;min-width:0}
.badge .ic{font-weight:800;font-size:15px;border-radius:8px;padding:2px 6px;align-self:flex-start;color:#fff}
.badge .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .rk{font-size:12px;color:var(--muted)}
.pick{cursor:pointer;text-align:left;font:inherit}
.beat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.beat div{background:var(--field);border-radius:12px;padding:10px;text-align:center}
.beat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.beat .t{font-size:13px;color:var(--muted)}
.banner{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--gold) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));margin-top:14px;font-weight:600}
.rephead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:var(--field);border:1px solid var(--line)}
.progress{height:10px;background:var(--field);border-radius:999px;overflow:hidden;margin:10px 0}
.progress > i{display:block;height:100%;background:var(--turf);border-radius:999px;transition:width .3s}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:12px}
.prompt{font-size:22px;font-weight:700;margin:0 0 12px}
.sentence{font-size:22px;background:var(--field);border-radius:14px;padding:14px;margin:0 0 12px}
.hearrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hearrow .btn{flex:1 1 140px}
.answer{width:100%;font-size:34px;font-weight:600;letter-spacing:.04em;padding:14px 16px;border-radius:14px;border:3px solid var(--line);background:var(--bg);outline:none;min-height:70px}
.answer:focus{border-color:var(--sky)}
.bigword{font-size:40px;font-weight:700;letter-spacing:.06em;text-align:center;padding:14px;border-radius:14px;background:var(--field);margin:6px 0 12px;word-break:break-all}
.coachline{font-weight:600;margin:6px 0 10px}
.hint{background:color-mix(in srgb,var(--sky) 14%,var(--panel));border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.tile{min-height:58px;min-width:72px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--field);font-size:26px;font-weight:700;cursor:pointer;touch-action:manipulation}
.tile.used{opacity:.25;pointer-events:none}
.built{min-height:64px;border:3px dashed var(--line);border-radius:14px;padding:10px;font-size:32px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.built span{background:var(--turf);color:var(--turf-ink);border-radius:10px;padding:2px 10px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{border-radius:16px;padding:14px;margin-bottom:12px}
.result.good{background:color-mix(in srgb,var(--ok) 16%,var(--panel));border:2px solid color-mix(in srgb,var(--ok) 50%,var(--line))}
.result.try{background:color-mix(in srgb,var(--gold) 16%,var(--panel));border:2px solid color-mix(in srgb,var(--gold) 50%,var(--line))}
.result .big{font-size:26px;font-weight:800}
.diff{display:grid;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.diff .lbl{font-size:13px;color:var(--muted);font-weight:600}
.diff .cells{display:flex;gap:3px;flex-wrap:nowrap}
.diff .c{min-width:28px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--field);font-size:24px;font-weight:700}
.diff .c.x{background:var(--gold);color:var(--gold-ink)}
.diff .c.gap{opacity:.5}
.tipline{font-weight:600;margin-top:8px}
.final .big{font-size:48px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid2 > div{background:var(--field);border-radius:12px;padding:12px}
.grid2 .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center}
.pips{display:flex;gap:6px}
.pip{width:34px;height:22px;border-radius:6px;background:var(--field);border:1px solid var(--line)}
.pip.on{background:var(--turf);border-color:var(--turf)}
.welcome{text-align:center;padding:40px 8px}
.welcome .huge{font-size:30px;font-weight:800;margin:20px 0}
.welcome .step{font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(6,12,21,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:18px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h2{margin:0 0 8px}
.pin{font-size:32px;letter-spacing:.4em;text-align:center;width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.float{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-size:34px;font-weight:800;pointer-events:none;z-index:60;animation:floatup 1.1s ease-out forwards;font-variant-numeric:tabular-nums}
.float.plus{color:var(--ok)} .float.minus{color:var(--coral)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.confetti{position:fixed;top:30%;left:50%;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:55;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.status{min-height:1.6em;font-weight:700;color:var(--turf);margin-top:10px}
/* coach */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.tab{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600;font-size:15px}
.tab.on{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tblwrap{overflow-x:auto;max-width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.form input,.form select,.coach textarea,.coach input[type=text],.coach input[type=date],.coach input[type=number]{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;width:100%}
.coach textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.ok{color:var(--ok);font-weight:700} .no{color:var(--bad);font-weight:700}
details summary{cursor:pointer;font-weight:600}
.reclist{display:grid;gap:8px;margin-top:8px}
.recrow{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field);display:grid;gap:8px}
.recword{font-size:18px}
.recbtns{display:flex;flex-wrap:wrap;gap:8px}
.recctl{display:flex;gap:6px}
svg text{fill:var(--muted);font-family:inherit}
@media (max-width:520px){
  body{font-size:17px}
  .bank-total{font-size:36px}
  .bankrow{grid-template-columns:1fr 1fr}
  .bankrow > :first-child{grid-column:1 / -1}
  .drills{grid-template-columns:repeat(2,1fr)}
  .answer{font-size:28px}
  .bigword{font-size:32px}
  .barrow{grid-template-columns:96px 1fr}
  .pip{width:26px}
}
.cashpop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;animation:cashpop 1.45s ease-out forwards}
.cp-coin{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6,var(--gold) 55%,#b97a00);color:#5a3b00;font-size:50px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(232,163,23,.35),0 10px 30px rgba(0,0,0,.25);animation:coinspin .6s ease-out}
.cashpop.big .cp-coin{width:110px;height:110px;font-size:64px}
.cp-amt{font-size:44px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--panel),0 0 12px var(--panel)}
.cashpop.big .cp-amt{font-size:56px}
.cp-word{font-size:26px;font-weight:800;color:var(--ink);background:var(--panel);border-radius:999px;padding:4px 16px;box-shadow:var(--shadow)}
.cp-fire{font-size:18px;color:var(--coral)}
@keyframes cashpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
@keyframes coinspin{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(720deg) scale(1)}}
.cashflash{position:fixed;inset:0;z-index:65;pointer-events:none;box-shadow:inset 0 0 0 10px var(--gold),inset 0 0 120px rgba(232,163,23,.45);animation:flash .65s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.coinfly{position:fixed;left:50%;top:34%;z-index:66;pointer-events:none;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6,var(--gold) 60%,#b97a00);color:#5a3b00;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;animation:coinfly 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes coinfly{0%{transform:translate(0,0) scale(.4)}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--r)) scale(1);opacity:0}}
.pill.money.bump{animation:bump .5s ease-out}
@keyframes bump{30%{transform:scale(1.35);background:var(--gold);color:var(--gold-ink)}}
.tierpill.e{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.tierpill.m{background:color-mix(in srgb,var(--sky) 20%,var(--panel))}
.tierpill.h{background:color-mix(in srgb,var(--gold) 35%,var(--panel))}
/* math reps */
.sport{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.sport button{min-height:52px;border-radius:12px;border:0;background:transparent;font-weight:800;font-size:18px;cursor:pointer;color:var(--ink);touch-action:manipulation}
.sport button.on{background:var(--board);color:var(--board-ink)}
.deck .deckhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.deckicon{width:46px;height:46px;flex:none;border-radius:12px;color:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
.deck .progress{margin:4px 0 6px}
.deck .small{margin-bottom:10px}
.fact{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 10px;letter-spacing:.02em;line-height:1.15}
.fact.sm{font-size:40px;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-size:.8em}
.frac span:first-child{border-bottom:4px solid currentColor;padding:0 8px}
.ansrow{display:flex;align-items:center;gap:8px}
.mans{flex:1;font-size:44px;font-weight:800;text-align:center;min-height:76px;border:3px solid var(--sky);border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mans .ph{color:var(--muted);opacity:.5}
.ansrow .pct{font-size:40px;font-weight:800}
.key.delkey{min-height:76px;min-width:72px;flex:none;font-size:28px}
.pill.clock{font-variant-numeric:tabular-nums;min-width:84px;justify-content:center}
.pill.clock.low{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.idk{margin-top:10px;min-height:48px;font-size:17px}
.asks{text-align:center;margin:0;font-size:18px;color:var(--muted)}
.asks b{color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--field);font-size:30px;font-weight:800;cursor:pointer;touch-action:manipulation;color:var(--ink);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(2px)}
.key.alt{font-size:26px}
.key.go{background:var(--turf);color:var(--turf-ink);border-color:var(--turf);font-size:24px}
.key.wide{grid-column:span 2}
.key.full{grid-column:1 / -1}
.strat{background:color-mix(in srgb,var(--sky) 14%,var(--panel));border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.arr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0}
.fgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;max-width:440px}
.fgrid div{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--field);color:var(--muted);min-width:0}
.fgrid .hd{background:none;font-size:12px}
.fgrid .mastered{background:var(--ok);color:#fff}
.fgrid .fast{background:color-mix(in srgb,var(--sky) 45%,var(--panel))}
.fgrid .learning{background:color-mix(in srgb,var(--gold) 55%,var(--panel))}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.fdpchips{display:flex;flex-wrap:wrap;gap:6px}
.fdpchips span{border-radius:10px;padding:4px 10px;font-weight:700;background:var(--field);font-size:14px}
.fdpchips .mastered{background:var(--ok);color:#fff}
.fdpchips .fast{background:color-mix(in srgb,var(--sky) 45%,var(--panel))}
.fdpchips .learning{background:color-mix(in srgb,var(--gold) 55%,var(--panel))}

function isObj(x){ return x && typeof x==='object' && !Array.isArray(x); }
function deepFill(base, saved){
  if(!isObj(saved)) return base;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(saved).forEach(k=>{
    if(isObj(base[k]) && isObj(saved[k])) out[k] = deepFill(base[k], saved[k]);
    else if(saved[k] !== undefined) out[k] = saved[k];
  });
  return out;
}
const Store = {
  key: STORE_KEY,
  migrate(obj){
    if(!isObj(obj)) return freshState();
    let s = deepFill(freshState(), obj);
    // v0/v1: bank stored as a single number, or missing fields
    if(typeof obj.bank === 'number'){ s.bank = {wallet:obj.bank, vault:0}; }
    if(!Array.isArray(s.drills) || s.drills.length!==DRILLS.length){
      const d = DRILLS.map((_,i)=> Object.assign({r:0,chunk:true,since:'',days:[]}, (obj.drills||[])[i]||{}));
      s.drills = d;
    }
    if(!Array.isArray(s.settings.drillsOn) || s.settings.drillsOn.length!==DRILLS.length) s.settings.drillsOn = DRILLS.map(()=>true);
    s.settings.money = Object.assign({}, DEFAULT_MONEY, s.settings.money||{});
    s.settings.math = Object.assign(JSON.parse(JSON.stringify(DEFAULT_MATH)), s.settings.math||{});
    s.settings.math.decksOn = Object.assign({mul:true,div:true,fdp:true}, s.settings.math.decksOn||{});
    if(!isObj(s.math)) s.math = freshState().math;
    if(!Array.isArray(s.math.reps)) s.math.reps=[];
    s.version = DATA_VERSION;
    return s;
  },
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(this.key); }catch(e){ raw = null; }
    if(!raw) return freshState();
    try{ return this.migrate(JSON.parse(raw)); }catch(e){ return freshState(); }
  },
  save(s){
    try{ localStorage.setItem(this.key, JSON.stringify(s)); return true; }catch(e){ return false; }
  },
  exportCode(s){ return 'GSG1:' + btoa(unescape(encodeURIComponent(JSON.stringify(s)))); },
  importCode(code){
    code = (code||'').trim();
    if(!code.startsWith('GSG1:')) throw new Error('That is not a backup code.');
    const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
    return this.migrate(obj);
  }
};

/* ---------- Google Drive sync (website version): a small Apps Script web app in the parent's
   Google account keeps one JSON file. Each device keeps the script address + family key. ---------- */
const SYNC_KEY = IS_TEST ? 'gsg.test.sync' : 'gsg.sync';
/* The family's sync script. Not secret on its own: every read and write also needs the family key. */
const DEFAULT_SYNC_URL = 'https://script.google.com/macros/s/AKfycbwMgFBKzpeOI-dvR7S4bKLBPHMY4HRpytNifxgEwmTKasMQ93zuABaXdMXWUbUB3Vsq/exec';
const GSync = {
  status:'off', timer:null, busy:false, again:false,
  cfg(){ try{ const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); return c && c.url && c.key ? c : null; }catch(e){ return null; } },
  setCfg(c){ try{ if(c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} },
  async call(body, cfg){
    const c = cfg || this.cfg(); if(!c) throw new Error('not set up');
    const r = await fetch(c.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({key:c.key}, body)), redirect:'follow'});
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'failed');
    return j;
  },
  busyPlaying(){ return !!(SES && ['practice','boss','combine','math','mathcheck'].indexOf(SES.mode)>=0); },
  watch(){ const c=this.cfg(); return !!(c && c.watch); },
  async init(){
    if(!this.cfg()) return;
    this.status='connecting'; if(ui.coachOpen) render();
    if(this.watch()){            // parent phone: read only, never writes to Drive
      try{ const j=await this.call({action:'load'}); if(j.state && typeof j.state==='object'){ S=Store.migrate(j.state); Store.save(S); } this.status='online'; this.pulledAt=Date.now(); }catch(e){ this.status='error'; }
      render(); return;
    }
    try{
      const j = await this.call({action:'load'});
      const remote = j.state;
      const remoteOk = remote && typeof remote==='object';
      // A device with no finished Combine or practice never replaces real progress, even if its clock is newer.
      const freshDevice = remoteOk && (remote.combines||[]).length && !(S.combines||[]).length;
      if(remoteOk && !this.busyPlaying() && (freshDevice || (remote.savedAt||0) > (S.savedAt||0))){
        S = Store.migrate(remote); Store.save(S);
      }
      else if(!remoteOk || (!freshDevice && (S.savedAt||0) > (remote.savedAt||0))) await this.push();
      this.status='online';
    }catch(e){ this.status='error'; }
    if(!this.busyPlaying()) render();
  },
  schedule(){ if(!this.cfg() || this.watch()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.push(), 2500); },
  async push(){
    if(!this.cfg() || this.watch()) return;
    if(this.busy){ this.again=true; return; }
    this.busy=true;
    try{
      const j = await this.call({action:'save', state:S});
      // the other device saved newer play: take it instead of overwriting (never mid-practice)
      if(j.stale && j.state && !this.busyPlaying()){ S = Store.migrate(j.state); Store.save(S); render(); }
      this.status='online';
    }catch(e){ this.status='error'; }
    this.busy=false;
    if(this.again){ this.again=false; this.push(); }
  },
  linkFor(watch){ const c=this.cfg(); if(!c) return ''; const p={u:c.url,k:c.key}; if(watch) p.w=1; const code=btoa(JSON.stringify(p)); return location.origin+location.pathname+'?sync='+encodeURIComponent(code); },
  takeLink(){
    const m = /[?&]sync=([^&]+)/.exec(location.search); if(!m) return false;
    try{ const o=JSON.parse(atob(decodeURIComponent(m[1]))); if(o.u && o.k){ this.setCfg({url:o.u, key:o.k, watch:!!o.w}); } }catch(e){}
    // The link stays in the address bar on purpose: an iPhone Home Screen app has its own storage,
    // and keeping the code means "Add to Home Screen" connects that app too.
    return true;
  }
};

/* ---------- Cloud save (online version only): the claude.ai artifact database ----------
   game/core          everything except the growing logs
   logs/<YYYY-MM>.<k> one month of reps, ledger or sessions (k = reps | ledger | sessions)
   Falls back to this device's storage when the online database is not available. */
const LOG_KEYS = ['reps','ledger','sessions'];
const Cloud = {
  db:null, on:false, status:'device', last:{}, known:new Set(), saving:false, again:false, timer:null, unsub:null,
  split(s){
    const core = {}; Object.keys(s).forEach(k=>{ if(LOG_KEYS.indexOf(k)<0) core[k]=s[k]; });
    const docs = {'core':core};
    LOG_KEYS.forEach(k=>{ (s[k]||[]).forEach(e=>{ const m=(e.t||'0000-00').slice(0,7); const id=m+'.'+k; (docs[id]=docs[id]||{k, m, items:[]}).items.push(e); }); });
    return docs;
  },
  compose(core, logDocs){
    const s = Object.assign({}, core); LOG_KEYS.forEach(k=>s[k]=[]);
    logDocs.sort((a,b)=>a.id.localeCompare(b.id)).forEach(d=>{ const b=d.body; if(b && LOG_KEYS.indexOf(b.k)>=0 && Array.isArray(b.items)) s[b.k]=s[b.k].concat(b.items); });
    return s;
  },
  async pull(){
    const core = await this.db.doc('game/core').get();
    if(!core.exists) return null;
    const logs = await this.db.collection('logs').get();
    const docs = logs.docs.map(d=>({id:d.id, body:d.data()}));
    this.known = new Set(docs.map(d=>d.id));
    const s = this.compose(core.data(), docs);
    // remember what is already stored so unchanged docs are not rewritten
    const parts = this.split(s); this.last = {}; Object.keys(parts).forEach(id=>this.last[id]=JSON.stringify(parts[id]));
    return s;
  },
  async init(){
    try{
      if(!(window.claude && typeof window.claude.use==='function')) return;
      const db = await window.claude.use('db'); if(!db) return;
      this.db = db;
      let remote = null;
      try{ remote = await this.pull(); }catch(e){ this.status='error'; return; }
      if(remote && (!S.savedAt || (remote.savedAt||0) >= S.savedAt)){
        S = Store.migrate(remote); Store.save(S);
      }
      this.on = true; this.status='online';
      if(!remote || (S.savedAt||0) > (remote.savedAt||0)) await this.flush();   // first time online, or newer offline play
      this.unsub = db.doc('game/core').onSnapshot(snap=>{
        if(!snap.exists || snap.metadata.hasPendingWrites) return;
        const b = snap.data(); if(!b || !b.savedAt || b.savedAt <= (S.savedAt||0)) return;
        if(GSync.busyPlaying()) return;   // never swap data mid-practice
        this.pull().then(r=>{ if(r){ S=Store.migrate(r); Store.save(S); render(); } }).catch(()=>{});
      }, ()=>{});
      render();
    }catch(e){ this.status='error'; }
  },
  schedule(){ if(!this.on) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 1200); },
  async flush(){
    if(!this.on) return;
    if(this.saving){ this.again=true; return; }
    this.saving=true;
    try{
      const parts = this.split(S);
      for(const id of Object.keys(parts)){
        const body = parts[id], json = JSON.stringify(body);
        if(this.last[id]===json) continue;
        const ref = id==='core' ? this.db.doc('game/core') : this.db.doc('logs/'+id);
        await ref.set(body);
        this.last[id]=json; if(id!=='core') this.known.add(id);
      }
      for(const id of Array.from(this.known)){ if(!parts[id]){ await this.db.doc('logs/'+id).delete(); this.known.delete(id); delete this.last[id]; } }
      this.status='online';
    }catch(e){ this.status = (e && e.code==='quota_exceeded') ? 'full' : 'error'; }
    this.saving=false;
    if(this.again){ this.again=false; this.flush(); }
  },
  label(){
    if(GSync.cfg()){
      if(GSync.watch()) return GSync.status==='error' ? 'Parent view: could not reach Google Drive just now.' : 'Parent view: reads Graham\'s progress from Google Drive and never changes it.';
      if(GSync.status==='online') return 'Synced to your Google Drive. Same bank and results on his iPhone and computer.';
      if(GSync.status==='connecting') return 'Connecting to your Google Drive…';
      if(GSync.status==='error') return 'Could not reach Google Drive. Saved on this device; it syncs when the connection is back.';
      return 'Google Drive sync is set up on this device.';
    }
    if(this.status==='online') return 'Saved to your Claude account. Opens with the same data on any computer.';
    if(this.status==='error') return 'Could not reach online saving. Saved on this device for now; it will try again.';
    if(this.status==='full') return 'Online storage is full. Saved on this device. Ask Claude to trim old records.';
    return 'Saved on this device only (file version).';
  }
};

/* =========================================================
   MONEY
   ========================================================= */
function cents(x){ return Math.round(x*100)/100; }
function fmt$(x){ const n=cents(x); return (n<0?'-':'')+'$'+Math.abs(n).toFixed(2); }
function weekEarned(s){ const ws=weekStart(today()); return cents(s.ledger.filter(e=>!e.p && e.amt>0 && e.t>=ws).reduce((a,e)=>a+e.amt,0)); }
function weekLost(s){ const ws=weekStart(today()); return cents(s.ledger.filter(e=>!e.p && e.amt<0 && e.t>=ws).reduce((a,e)=>a-e.amt,0)); }
function todayLost(s){ const t=today(); return cents(s.ledger.filter(e=>!e.p && e.amt<0 && e.t===t).reduce((a,e)=>a-e.amt,0)); }
/* amount: positive earns, negative loses. opts.vault: earn into the Vault. opts.boss: doubled. Returns the amount actually applied. */
function addMoney(s, amount, reason, opts){
  opts = opts||{};
  let amt = cents(amount * (opts.boss?2:1));
  if(amt===0) return 0;
  if(amt>0){
    const room = cents(s.settings.weeklyCap - weekEarned(s));
    if(room<=0) return 0;
    amt = cents(Math.min(amt, room));
    if(opts.vault) s.bank.vault = cents(s.bank.vault+amt); else s.bank.wallet = cents(s.bank.wallet+amt);
  } else {
    const lossRoom = cents(s.settings.dailyLossCap - todayLost(s));
    const loss = cents(Math.max(0, Math.min(-amt, lossRoom, s.bank.wallet)));   // Vault never loses; wallet never below $0
    if(loss<=0) return 0;
    amt = -loss;
    s.bank.wallet = cents(s.bank.wallet - loss);
  }
  s.ledger.push({t:today(), amt, v:opts.vault?1:0, r:reason, p:0});
  return amt;
}
function recordPayout(s, amount, date){
  let amt = cents(Math.max(0, Number(amount)||0));
  const total = cents(s.bank.wallet + s.bank.vault);
  amt = Math.min(amt, total);
  if(amt<=0) return 0;
  const fromWallet = Math.min(amt, s.bank.wallet);
  const fromVault = cents(amt - fromWallet);
  s.bank.wallet = cents(s.bank.wallet - fromWallet);
  s.bank.vault = cents(s.bank.vault - fromVault);
  s.payouts.push({t:date||today(), amt});
  s.ledger.push({t:date||today(), amt:-amt, v:0, r:'Payout', p:1});
  return amt;
}
function weeklyCapHit(s){ return weekEarned(s) >= s.settings.weeklyCap; }

let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function tone(freq, dur, type, vol, when){
  if(S.settings.muted) return; const c=ac(); if(!c) return;
  try{
    const t = c.currentTime + (when||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur, vol, when, hp){
  if(S.settings.muted) return; const c=ac(); if(!c) return;
  try{
    const t=c.currentTime+(when||0), len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=c.createBufferSource(); src.buffer=buf; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||3000;
    const g=c.createGain(); g.gain.value=vol||0.2; src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  }catch(e){}
}

const Clips = {
  db:null, keys:new Set(), ready:false,
  key(w, part){ return norm(w)+'|'+part; },
  open(){
    return new Promise(res=>{
      try{
        if(!window.indexedDB){ this.ready=true; return res(false); }
        const rq = indexedDB.open(IS_TEST?'gsg-test-audio':'gsg-audio', 1);
        rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('clips'); };
        rq.onsuccess = ()=>{ this.db=rq.result;
          try{ const tx=this.db.transaction('clips','readonly').objectStore('clips').getAllKeys();
            tx.onsuccess=()=>{ (tx.result||[]).forEach(k=>this.keys.add(k)); this.ready=true; res(true); };
            tx.onerror=()=>{ this.ready=true; res(true); };
          }catch(e){ this.ready=true; res(true); } };
        rq.onerror = ()=>{ this.ready=true; res(false); };
      }catch(e){ this.ready=true; res(false); }
    });
  },
  has(w, part){ return this.keys.has(this.key(w,part)); },
  put(w, part, blob){
    return new Promise(res=>{ try{ const tx=this.db.transaction('clips','readwrite'); tx.objectStore('clips').put(blob, this.key(w,part)); tx.oncomplete=()=>{ this.keys.add(this.key(w,part)); res(true); }; tx.onerror=()=>res(false); }catch(e){ res(false); } });
  },
  get(w, part){
    return new Promise(res=>{ try{ const rq=this.db.transaction('clips','readonly').objectStore('clips').get(this.key(w,part)); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }catch(e){ res(null); } });
  },
  del(w, part){
    return new Promise(res=>{ try{ const tx=this.db.transaction('clips','readwrite'); tx.objectStore('clips').delete(this.key(w,part)); tx.oncomplete=()=>{ this.keys.delete(this.key(w,part)); res(true); }; tx.onerror=()=>res(false); }catch(e){ res(false); } });
  }
};

/* ---------- Speech: coach recording if there is one, else the best computer voice ---------- */
/* Robotic or novelty voices that ship with Macs; never chosen automatically */
const BAD_VOICES = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
function voiceScore(v){
  if(!/^en/i.test(v.lang)) return -1;
  if(BAD_VOICES.test(v.name)) return 0;
  let s = 10;
  if(/en[-_]US/i.test(v.lang)) s += 20;
  if(/Premium/i.test(v.name)) s += 60;

function readMiss(item, ans){

    if(hasDouble(w) && !hasDouble(a)) return 'missed a double letter in the base word'; return 'y-to-i ending not spelled right'; }

    if(/ied$/.test(a) && !/ied$/.test(w)) return 'used -ied where the word just adds -ed'; return 'doubling ending not right'; }
  if(d===3){ if(LOOKALIKE_SET.has(a)) return 'picked the look-alike "'+a+'"'; return 'look-alike word not spelled right'; }

/* ---------- Word levels: Warm-up (easy), Game speed (medium), Big play (hard) ---------- */
const TIERS = {e:{name:'Warm-up', cls:'e'}, m:{name:'Game speed', cls:'m'}, h:{name:'Big play', cls:'h'}};
const LA_TIER = {to:'e',too:'e',two:'e',no:'e',know:'e',hear:'e',here:'e',then:'e',than:'e',your:'m',"you're":'m',its:'m',"it's":'m',their:'m',there:'m',"they're":'m',whose:'m',"who's":'m',piece:'m',peace:'m',threw:'m',through:'m',weather:'h',whether:'h',accept:'h',except:'h'};
/* Difficulty = syllables and length. Each drill is ranked against itself, so every drill has

function difficulty(x){ return sylCount(x)*3 + x.w.length + (/([a-z])\1/i.test(x.w)?1:0); }
const TIER_MAP = {};
DRILLS.forEach((_,d)=>{

const TIER_MIX = [[0.4,0.4,0.2],[0.3,0.45,0.25],[0.2,0.45,0.35],[0.15,0.45,0.4],[0.1,0.4,0.5]];
function wordPriority(x, low){

/* Warm-up first, no Big plays back to back, Warm-ups sprinkled in so wins keep coming */
function orderByTier(list){
  const B={e:[],m:[],h:[]}; shuffle(list.slice()).forEach(x=>B[tierOf(x)].push(x));
  const out=[]; const take=k=>{ if(B[k].length) { out.push(B[k].shift()); return true; } return false; };

  take('e') || take('m') || take('h');

  let i=0, guard=0;
  while((B.e.length||B.m.length||B.h.length) && guard++<200){
    const want=pattern[i++%pattern.length];

function buildPracticeQueue(drillFilter){
  const n = Math.max(5, Number(S.settings.practiceReps)||15);
  const pool = allPractice().filter(x=>S.settings.drillsOn[x.d] && (drillFilter==null || x.d===drillFilter));
  const low = focusDrills();
  const ranks = drillFilter!=null ? [S.drills[drillFilter].r] : S.drills.filter((_,d)=>S.settings.drillsOn[d]).map(d=>d.r);
  const avgRank = Math.round(ranks.reduce((a,b)=>a+b,0)/Math.max(1,ranks.length));
  const mix = TIER_MIX[Math.min(4,Math.max(0,avgRank))];

    st.due = addDays(t, BOX_DAYS[st.b]);
    if(st.days.indexOf(t)<0) st.days.push(t);
    if(!st.m && st.days.length>=3){ st.m=1; return true; }
  } else if(ok){
    st.b = Math.max(1, st.b); st.due = addDays(t,1);
  } else {
    st.b = 1; st.due = t;   // back to box 1, comes back next practice
  }
  return false;
}

const SPORT_KEY = IS_TEST ? 'gsg.test.sport' : 'gsg.sport';
let ui = { screen:'home', welcome:0, coachTab:'progress', coachOpen:false, pickDrill:false, modal:null, sport:(function(){ try{ return localStorage.getItem(SPORT_KEY)==='math'?'math':'spelling'; }catch(e){ return 'spelling'; } })() };

function startPractice(drillFilter){

  newRep(); ui.screen='rep'; render(); autoSpeak();
}
function curItem(){ return (SES && SES.queue) ? SES.queue[SES.idx] : null; }
function rankOf(d){ return S.drills[d].r; }
function useChunkBuilder(item){
  return SES.mode==='practice' && rankOf(item.d)===0 && S.drills[item.d].chunk && sylCount(item)>=3 && item.d!==3;
}
function newRep(){
  const item = curItem(); if(!item) return;
  SES.rep = {phase: useChunkBuilder(item)?'chunk':'spell', ans:'', checkedAns:null, hint:false, hintText:'', chunkUsed:useChunkBuilder(item), built:[], tiles:null, fix:0, fixMsg:'', result:null, status:''};
  if(SES.rep.chunkUsed){
    const parts = item.syl.split('-');
    const decoys = makeDecoys(parts);
    SES.rep.tiles = shuffle(parts.map((p,i)=>({t:p, real:true, k:'r'+i})).concat(decoys.map((p,i)=>({t:p, real:false, k:'d'+i}))));
    SES.rep.parts = parts;
  }
}
function makeDecoys(parts){
  const swaps={a:'i',e:'i',i:'e',o:'u',u:'o',y:'i'};
  const out=[];
  const cands = shuffle(parts.slice());
  for(const p of cands){
    if(out.length>=2) break;
    let dcy = null;
    if(/(.)\1/.test(p)) dcy = p.replace(/(.)\1/,'$1');
    else { for(let i=p.length-1;i>=0;i--){ const ch=p[i].toLowerCase(); if(swaps[ch]){ dcy=p.slice(0,i)+swaps[ch]+p.slice(i+1); break; } } }
    if(!dcy || dcy===p) dcy = p+'e';
    if(parts.indexOf(dcy)<0 && out.indexOf(dcy)<0) out.push(dcy);
  }
  while(out.length<2) out.push(parts[0]+'h'.repeat(out.length+1));
  return out;
}
function autoSpeak(){ const it=curItem(); if(it && Speech.ok && SES && (SES.rep.phase==='spell'||SES.rep.phase==='chunk')) setTimeout(()=>{ if(curItem()===it) Speech.say(it); }, 350); }

function hintAllowed(item){
  if(SES.mode!=='practice') return false;
  const r=rankOf(item.d); return r<=1 && !SES.rep.chunkUsed;
}
function takeHint(){
  const item=curItem(); if(!item || !hintAllowed(item) || SES.rep.hint) return;
  const r = rankOf(item.d);
  SES.rep.hint = true;
  if(r===0) SES.rep.hintText = item.w.length+' letters. It starts with "'+item.w[0].toLowerCase()+'".';
  else { SES.rep.hintText = sylCount(item)+' chunks. It starts with "'+item.w[0].toLowerCase()+'".'; const a=addMoney(S,-S.settings.money.hintCost,'Hint',{}); trackMoney(a); }
  save(); render();
}
function trackMoney(a){ if(!a) return; if(a>0) SES.earned=cents(SES.earned+a); else SES.lost=cents(SES.lost-a); floatMoney(a); }

function tapTile(k){
  const rep=SES.rep; const tile=rep.tiles.find(x=>x.k===k); if(!tile||tile.used) return;
  const need = rep.parts[rep.built.length];
  if(tile.t===need){ tile.used=true; rep.built.push(tile.t); Sound.tap();
    if(rep.built.length===rep.parts.length){ rep.status='Nice build. Now type the whole word.'; rep.phase='spell'; }
    render();
  } else {
    rep.status='Not that chunk. Try another one.'; render();
    const el=document.querySelector('[data-k="'+k+'"]'); if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); }
  }
}

function doCheck(){
  const rep=SES.rep; if(rep.phase!=='spell') return;
  const v = (document.getElementById('ans')||{}).value; if(v!==undefined) rep.ans=v;
  if(!norm(rep.ans)){ rep.status='Type your best try first.'; render(); return; }
  rep.checkedAns = rep.ans; rep.phase='check'; rep.status=''; render();
}
function doLock(sure){
  const rep=SES.rep; if(rep.phase!=='check') return;   // Lock is only possible after Check
  const v = (document.getElementById('ans')||{}).value; if(v!==undefined) rep.ans=v;
  if(!norm(rep.ans)){ rep.status='Type your best try first.'; render(); return; }
  const item=curItem();
  if(SES.mode==='combine') return lockCombine(item, rep);
  const ok = norm(rep.ans)===norm(item.w);
  const edited = norm(rep.ans)!==norm(rep.checkedAns);
  const fixed = ok && edited && norm(rep.checkedAns)!==norm(item.w);
  const pattern = !ok && hasChunk(rep.ans,item);
  const m=S.settings.money, boss=SES.mode==='boss';
  const helped = rep.hint || rep.chunkUsed;
  let applied=0, msgs=[];
  // base
  if(ok){
    const base = rep.chunkUsed ? m.chunk : rep.hint ? m.hint : fixed ? m.fixed : m.correct;
    applied += addMoney(S, base, ok&&fixed?'Great catch':'Correct', {boss});
  } else if(pattern){
    applied += addMoney(S, m.pattern, 'Pattern point', {boss});
  } else {
    applied += addMoney(S, -m.wrong, 'Wrong answer', {boss});
  }
  // confidence call
  if(sure!==null && sure!==undefined){
    SES.conf.total++;
    if((sure&&ok)||(!sure&&!ok)) SES.conf.right++;
    const half = rep.chunkUsed?0.5:1;
    if(sure && ok) applied += addMoney(S, m.sureRight*half, 'Sure and right', {boss});
    if(sure && !ok) applied += addMoney(S, -m.sureWrong*half, 'Sure and wrong', {boss});
  }
  // streak
  if(ok){ SES.streak++; SES.bestStreak=Math.max(SES.bestStreak,SES.streak);
    if(SES.streak%5===0){ applied += addMoney(S, m.streak5, '5 in a row', {boss}); msgs.push(SES.streak+' in a row!'); }
  } else SES.streak=0;
  // Big play bonus for hard words; after a miss the next rep is a Warm-up
  if(ok && tierOf(item)==='h'){ applied += addMoney(S, m.bigPlay, 'Big play bonus', {boss}); msgs.push('Big play bonus: +'+fmt$(m.bigPlay*(boss?2:1))+'!'); }
  if(!ok && SES.mode==='practice'){ SES.missRun=(SES.missRun||0)+1; easyNext(); if(SES.missRun>=2) msgs.push("Shake it off. Next one's a warm-up."); }
  else if(ok) SES.missRun=0;
  // word + drill tracking
  const newlyMastered = updateWordAfterRep(item, ok, helped);
  if(newlyMastered){ applied += addMoney(S, m.mastered, 'Word mastered: '+item.w, {vault:true}); msgs.push('Word mastered! +'+fmt$(m.mastered)+' to your Vault.'); }
  if(SES.mode==='practice'){ updateDrillDay(item.d, ok, helped); SES.touched.add(item.d); }
  S.reps.push({t:today(), w:item.w, d:item.d, ok:ok?1:0, h:rep.hint?1:0, c:rep.chunkUsed?1:0, f:fixed?1:0, m:boss?'b':'p', a:rep.ans.trim().slice(0,40)});
  if(S.reps.length>6000) S.reps.splice(0, S.reps.length-6000);
  SES.log.push({w:item.w, d:item.d, ans:rep.ans.trim(), ok, pattern, fixed, sure});
  if(applied>0) SES.earned=cents(SES.earned+applied); else if(applied<0) SES.lost=cents(SES.lost-applied);
  // reinsert a missed word once later in this practice
  if(!ok && SES.mode==='practice' && !SES.reinserted.has(item.w)){
    SES.reinserted.add(item.w);
    const pos = Math.min(SES.queue.length, SES.idx+3+Math.floor(Math.random()*2));
    SES.queue.splice(pos,0,item);
    const cap = Math.max(5, Number(S.settings.practiceReps)||15);
    if(SES.queue.length>cap) SES.queue.length = cap;
  }
  rep.result = {ok, pattern, fixed, applied, msgs, sure};
  rep.phase = 'result';
  save();
  render();
  if(ok) celebrate(applied, item, SES.streak, fixed); else { Sound.soft(); floatMoney(applied); }
}
function lockCombine(item, rep){
  const ok = norm(rep.ans)===norm(item.w);

  S.combineCur.items.push({w:item.w, d:item.d, ans:rep.ans.trim(), ok:ok?1:0, pat:pat?1:0, ed:ed?1:0});
  S.combineCur.idx = SES.idx+1;
  save();                                        // saved after every word

}
function fixRep(){

function endSession(full){
  if(!SES || SES.mode==='combine'){ ui.screen='home'; SES=null; render(); return; }
  const m=S.settings.money, t=today(), boss=SES.mode==='boss';
  const reps=SES.log.length, correct=SES.log.filter(x=>x.ok).length;
  const acc = reps? correct/reps : 0;
  const extras=[];
  let bonus=0;
  if(reps>0){
    if(!boss && full && S.dailyGoalDay!==t){ S.dailyGoalDay=t; bonus+=addMoney(S,m.dailyGoal,'Daily goal'); extras.push('Daily goal done: +'+fmt$(m.dailyGoal)); }
    // day streak
    if(S.streak.last!==t){ S.streak.days = (S.streak.last===addDays(t,-1)) ? S.streak.days+1 : 1; S.streak.last=t;
      if(S.streak.days%5===0){ bonus+=addMoney(S,m.dayStreak5,'Day streak'); extras.push(S.streak.days+' days in a row: +'+fmt$(m.dayStreak5)); } }
    if(boss){
      const score=correct;
      S.boss.push({t, score, items:SES.log.map(x=>({w:x.w,d:x.d,ans:x.ans,ok:x.ok?1:0}))});

    } else {

    if(bonus>0) SES.earned=cents(SES.earned+bonus);
    S.sessions.push({t, mode:SES.mode, mins:Math.max(1,Math.round((Date.now()-SES.start)/60000)), reps, correct, earned:SES.earned, lost:SES.lost, full:full?1:0, bestStreak:SES.bestStreak});
  }
  save();
  SES.final = {reps, correct, acc, extras};
  ui.screen='final'; if(reps) Sound.horn(); render();
}

function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function align(a,b){
  const n=a.length,m=b.length, dp=[];
  for(let i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=m;j++) dp[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const out=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ out.push([a[i-1],b[j-1]]); i--; j--; }
    else if(i>0&&dp[i][j]===dp[i-1][j]+1){ out.push([a[i-1],null]); i--; }
    else { out.push([null,b[j-1]]); j--; }
  }
  return out.reverse();
}
function diffHTML(ans, word){
  const pairs = align(norm(ans).split(''), word.toLowerCase().split(''));
  const row = side => pairs.map(p=>{ const ch=p[side]; const x = p[0]!==p[1]; return '<span class="c'+(x?' x':'')+(ch===null?' gap':'')+'">'+(ch===null?'·':esc(ch))+'</span>'; }).join('');
  return '<div class="diff"><div class="lbl">You wrote</div><div class="cells">'+row(0)+'</div><div class="lbl">The spelling</div><div class="cells">'+row(1)+'</div></div>';
}
function tipFor(item){ if(item.trick) return item.trick; return DRILLS[item.d].tip; }
function wordIndex(s,w){
  const re=new RegExp("(^|[^A-Za-z'])("+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")(?=$|[^A-Za-z'])","i");
  const m=re.exec(s.replace(/’/g,"'")); return m ? m.index+m[1].length : -1;
}
function maskSentence(item){ const i=wordIndex(item.s,item.w); if(i<0) return esc(item.s); return esc(item.s.slice(0,i))+'_____'+esc(item.s.slice(i+item.w.length)); }
function drillBadge(d, clickable){

}

  const r = S.reps.filter(x=>x.t>=ws_ && x.t<we);

  const solo = r.filter(x=>!x.h && !x.c);
  return {

function recordList(filter){

/* =========================================================
   MATH REPS: ENGINE
   Speed Check (placement) → small sets of new facts mixed with known ones

function deckFacts(d){ return FACTS.filter(f=>f.deck===d).sort((x,y)=>x.ease-y.ease); }

}

/* One question for a fact. Times facts flip order at random; division asks either way. */
function makePrompt(f){
  if(f.deck==='mul'){ const flip=Math.random()<0.5; const x=flip?f.b:f.a, y=flip?f.a:f.b; return {kind:'num', x, y, text:x+' × '+y, ans:String(f.p)}; }
  if(f.deck==='div'){ const byA = f.a===f.b || Math.random()<0.5; const dv=byA?f.a:f.b, q=byA?f.b:f.a; return {kind:'num', dv, q, text:f.p+' ÷ '+dv, ans:String(q)}; }
  const types = f.d===3 ? ['f2d','f2p'] : ['f2d','f2p','p2f'];
  const kind = types[Math.floor(Math.random()*types.length)];
  return {kind, text: kind==='p2f' ? f.pct+'%' : f.n+'/'+f.d, ans: kind==='f2d'?f.dec : kind==='f2p'?f.pct : f.n+'/'+f.d};
}
/* Grade an answer. Decimals: 0.5 = .5 = 0.50. Thirds: 0.33 / 0.333 / 33 / 33.3 all count.
   Fractions must be in simplest form; an equal but unsimplified one gets a "simplify" note. */
function gradeMath(f, pr, raw){
  const a = String(raw==null?'':raw).replace(/\s+/g,'').replace(/%$/,'');
  if(!a) return {ok:false, blank:true};
  if(pr.kind==='num') return {ok: /^\d+$/.test(a) && Number(a)===Number(pr.ans)};
  if(pr.kind==='p2f'){
    const m=/^(\d+)\/(\d+)$/.exec(a); if(!m) return {ok:false};
    const n=Number(m[1]), d=Number(m[2]); if(!d) return {ok:false};
    if(n===f.n && d===f.d) return {ok:true};
    if(n*f.d===d*f.n) return {ok:false, simplify:true};
    return {ok:false};
  }
  if(a.indexOf('/')>=0 || !/^\d*\.?\d*$/.test(a) || a==='.') return {ok:false};
  const v = Number(a.charAt(0)==='.' ? '0'+a : a);
  const target = pr.kind==='f2d' ? f.n/f.d : 100*f.n/f.d;
  if(f.d===3){
    const dp=(a.split('.')[1]||'').length;
    return {ok: pr.kind==='f2d' ? (dp>=2 && Math.abs(v-target)<=0.007) : Math.abs(v-target)<=0.7};
  }
  return {ok: Math.abs(v-target)<1e-9};
}
/* The strategy for a times fact, worked out with the real numbers.
   f = the "times" we use the trick for (the easier one), n = the other number. */
function strategy(x,y){
  const f = MATH_ORDER.indexOf(x)<=MATH_ORDER.indexOf(y) ? x : y, n = f===x ? y : x, p=x*y;
  const o = {f, n, p, split:null, minus:false, text:''};
  switch(f){
    case 2: o.text='Double '+n+': '+n+' + '+n+' = '+p+'.'; o.split=[1,1]; break;
    case 10: o.text='Times 10: put a zero on the end. '+n+' → '+p+'.'; break;
    case 5: o.text='Times 5 is half of times 10. '+n+' × 10 = '+(n*10)+'. Half of that is '+p+'.'; break;
    case 11: if(n<=9) o.text=n+' × 11: write the digit twice. '+p+'.'; else { o.text=n+' × 10 = '+(n*10)+', plus one more '+n+' = '+p+'.'; o.split=[10,1]; } break;
    case 3: o.text='Double '+n+' = '+(2*n)+', plus one more '+n+' = '+p+'.'; o.split=[2,1]; break;
    case 4: o.text='Double, then double again: '+n+' → '+(2*n)+' → '+p+'.'; o.split=[2,2]; break;
    case 9: o.text=n+' × 10 = '+(10*n)+', take away one '+n+': '+(10*n)+' − '+n+' = '+p+'.'; o.minus=true; break;
    case 6: o.text=n+' × 5 = '+(5*n)+', plus one more '+n+' = '+p+'.'; o.split=[5,1]; break;
    case 8: o.text='Double three times: '+n+' → '+(2*n)+' → '+(4*n)+' → '+p+'.'; o.split=[4,4]; break;
    case 12: o.text=n+' × 10 = '+(10*n)+', plus '+n+' × 2 = '+(2*n)+'. '+(10*n)+' + '+(2*n)+' = '+p+'.'; o.split=[10,2]; break;
    default: o.text=n+' × 5 = '+(5*n)+', plus '+n+' × 2 = '+(2*n)+'. '+(5*n)+' + '+(2*n)+' = '+p+'.'; o.split=[5,2];
  }
  return o;
}
function tipForFact(f, pr){
  if(f.deck==='fdp') return f.tip;
  if(f.deck==='mul'){ const s=strategy(pr.x, pr.y); return (pr.x!==s.f ? pr.x+' × '+pr.y+' is the same as '+s.f+' × '+s.n+'. ' : '')+s.text; }
  const s=strategy(pr.dv, pr.q);
  return 'Think times: '+pr.dv+' × ? = '+f.p+'. '+s.text+' So '+f.p+' ÷ '+pr.dv+' = '+pr.q+'.';
}
/* Dot picture: f rows of n. The colors show the split the strategy uses. */
function arraySVG(x,y){
  const s=strategy(x,y); const rows = s.minus ? 10 : s.f, cols = s.n;
  const c = Math.max(9, Math.min(16, Math.floor(190/Math.max(rows,cols)))), r = c*0.36;
  const W = cols*c+8, H = rows*c+8;
  let g='';
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    let col='var(--sky)', op=1;
    if(s.split){ col = i < s.split[0] ? 'var(--ok)' : 'var(--gold)'; }
    if(s.minus && i===rows-1){ col='var(--coral)'; op=0.35; }
    g+='<circle cx="'+(4+j*c+c/2)+'" cy="'+(4+i*c+c/2)+'" r="'+r.toFixed(1)+'" fill="'+col+'" opacity="'+op+'"/>';
  }
  if(s.minus) g+='<line x1="2" y1="'+(4+(rows-1)*c+c/2)+'" x2="'+(W-2)+'" y2="'+(4+(rows-1)*c+c/2)+'" stroke="var(--coral)" stroke-width="2"/>';
  const cap = s.minus ? '10 rows of '+s.n+', take away 1 row' : s.f+' row'+(s.f===1?'':'s')+' of '+s.n;
  return '<div class="arr"><svg viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px;width:100%" role="img" aria-label="'+esc(cap)+'">'+g+'</svg><div class="muted small">'+esc(cap)+'</div></div>';
}

/* Money: a fact's lifetime total never goes over factCap. Reps share repCap; mastery pays the rest. */
function mathEarn(k, amt, reason, mastery){
  const st=fs(k), m=S.settings.math;
  const limit = mastery ? Number(m.factCap) : Math.min(Number(m.repCap), Number(m.factCap));
  const room = cents(limit - st.e); if(room<=0 || amt<=0) return 0;
  const a = addMoney(S, Math.min(amt, room), reason, {vault:!!mastery});
  if(a>0) st.e = cents(st.e + a);
  return a;
}

/* Practice queue: up to newPer focus facts, each 3 times, spread out; the rest is review and known facts. */
function buildMathQueue(deck){
  const N = Math.max(8, Math.min(40, Number(S.settings.math.reps)||20));
  const t=today(), all=deckFacts(deck);
  const learning = all.filter(f=>fget(f.k).b===1).sort((x,y)=>(fget(y.k).miss-fget(x.k).miss)||x.ease-y.ease);
  const fresh = all.filter(f=>fget(f.k).b===0);
  const focus = learning.concat(fresh).slice(0, Math.max(1, Number(S.settings.math.newPer)||3));
  const due = shuffle(all.filter(f=>fget(f.k).b>=2 && fget(f.k).due<=t));
  const known = shuffle(all.filter(f=>fget(f.k).b>=2 && fget(f.k).due>t));
  const q = new Array(N).fill(null);
  focus.forEach((f,j)=>[j, j+4, j+10].forEach(p=>{
    let i=Math.min(p,N-1); while(i<N && q[i]) i++;
    if(i>=N){ i=N-1; while(i>=0 && q[i]) i--; }
    if(i>=0) q[i]=f;
  }));
  const fill = due.concat(known), extra = learning.concat(fresh).slice(focus.length, focus.length+3);
  let fi=0, xi=0;
  for(let i=0;i<N;i++){
    if(q[i]) continue;
    if(fi<fill.length) q[i]=fill[fi++];
    else if(xi<extra.length) q[i]=extra[xi++];
    else q[i]=focus.length ? focus[i%focus.length] : all[Math.floor(Math.random()*all.length)];
  }
  for(let pass=0;pass<3;pass++) for(let i=1;i<N;i++){
    if(q[i].k!==q[i-1].k) continue;
    for(let j=i+1;j<N;j++){ if(q[j].k!==q[i-1].k && (i+1>=N || q[j].k!==q[i+1].k)){ const tmp=q[i]; q[i]=q[j]; q[j]=tmp; break; } }
  }
  return q;
}
/* After a scored rep. Box goes up at most once a day. Returns true when newly mastered. */
function updateFactAfterRep(f, ok, fast){
  const st=fs(f.k), t=today();
  st.seen++;
  if(ok) st.ok++; else st.miss++;
  if(fast){
    st.fast++;
    if(st.up!==t){ st.b = st.b<2 ? 2 : Math.min(4, st.b+1); st.up=t; }
    if(st.days.indexOf(t)<0){ st.days.push(t); if(st.days.length>8) st.days.shift(); }
    st.due = addDays(t, st.m ? 14 : MATH_BOX[st.b]);
    if(!st.m && st.days.length>=3){ st.m=1; return true; }
  } else if(ok){
    st.b = Math.max(1, st.b); if(st.b<2) st.due=t; else st.due=addDays(t,1);
  } else {
    st.b = 1; st.due = t;
  }
  return false;
}

function startMath(deck){
  if(!deckChecked(deck)) return startMathCheck(deck);
  SES = {mode:'math', deck, queue:buildMathQueue(deck), idx:0, start:Date.now(), log:[], earned:0, lost:0, streak:0, bestStreak:0, reinserted:new Set(), mastered:[]};
  newMathRep(); ui.screen='mrep'; render();
}
function startMathCheck(deck){
  const cur=S.math.checkCur;
  if(!cur || cur.deck!==deck){ S.math.checkCur={deck, order:shuffle(deckFacts(deck).map(f=>f.k)), idx:0, items:[], started:today()}; save(); }
  const c=S.math.checkCur;
  SES = {mode:'mathcheck', deck, queue:c.order.map(k=>FACT[k]), idx:c.idx, start:Date.now(), log:[], earned:0, lost:0, streak:0, bestStreak:0, round:1, roundN:0, roundStart:Date.now(), rbreak:false};
  newMathRep(); ui.screen='mrep'; render();
}
function newMathRep(){
  const f=curItem(); if(!f) return;
  SES.rep = {pr:makePrompt(f), ans:'', t0:(window.performance?performance.now():Date.now()), phase:'ask', status:'', result:null, fixTries:0};
}
function nowMs(){ return window.performance ? performance.now() : Date.now(); }
function mathKey(k){
  if(!SES || !SES.rep || SES.rbreak) return; const rep=SES.rep;
  if(k==='go'){ if(rep.phase==='ask') mathSubmit(); else if(rep.phase==='fix') mathFix(); else if(rep.phase==='result') mathAfter(); return; }
  if(rep.phase!=='ask' && rep.phase!=='fix') return;
  if(k==='del') rep.ans=rep.ans.slice(0,-1);
  else {
    if(rep.ans.length>=7) return;
    if(k==='.' && (rep.ans.indexOf('.')>=0 || rep.ans.indexOf('/')>=0)) return;
    if(k==='/' && (rep.ans.indexOf('/')>=0 || rep.ans.indexOf('.')>=0 || !rep.ans)) return;
    rep.ans+=k;
  }
  rep.status='';
  const b=document.getElementById('mans'); if(b) b.innerHTML = rep.ans ? esc(rep.ans) : '<span class="ph">?</span>';
  const st=document.getElementById('status'); if(st) st.textContent='';
}
function mathSubmit(){
  const rep=SES.rep; if(!rep || rep.phase!=='ask' || SES.rbreak) return;
  if(!rep.ans){ rep.status='Tap your answer first.'; render(); return; }
  const f=curItem(), ms=Math.round(nowMs()-rep.t0), g=gradeMath(f, rep.pr, rep.ans);
  const fast = g.ok && ms<=fastLimit(f);
  if(SES.mode==='mathcheck') return lockMathCheck(f, rep, g.ok, fast, ms);
  const m=S.settings.math; let applied=0; const msgs=[];
  if(g.ok){ applied += mathEarn(f.k, fast?m.fast:m.slow, 'Math: '+(fast?'fast ':'')+rep.pr.text); }
  const newly = updateFactAfterRep(f, g.ok, fast);
  let bonus=0;
  if(newly){ bonus = mathEarn(f.k, Number(m.factCap), 'Math fact mastered: '+factLabel(f), true); applied+=bonus; SES.mastered.push(f.k); msgs.push('Fact mastered! '+(bonus>0?'+'+fmt$(bonus)+' to your Vault.':'')); }
  if(g.ok){ SES.streak++; SES.bestStreak=Math.max(SES.bestStreak,SES.streak); } else SES.streak=0;
  S.math.reps.push({t:today(), k:f.k, q:rep.pr.text, a:rep.ans.slice(0,12), ok:g.ok?1:0, fs:fast?1:0, ms});
  if(S.math.reps.length>4000) S.math.reps.splice(0, S.math.reps.length-4000);
  SES.log.push({k:f.k, ok:g.ok, fast, ms});
  if(applied>0) SES.earned=cents(SES.earned+applied);
  if(!g.ok && !SES.reinserted.has(f.k)){
    SES.reinserted.add(f.k);
    const pos=Math.min(SES.queue.length, SES.idx+3);
    SES.queue.splice(pos,0,f);
    const cap=Math.max(8, Math.min(40, Number(m.reps)||20))+3;
    if(SES.queue.length>cap) SES.queue.length=cap;
  }
  rep.result={ok:g.ok, fast, ms, applied, bonus, simplify:!!g.simplify, mastered:newly, msgs};
  rep.phase='result';
  save(); render();
  if(g.ok){
    if(newly) celebrate(applied, null, SES.streak, false, 'Fact mastered!');
    else if(applied>0){ Sound.cash(false); floatMoney(applied); const bank=document.querySelector('.pill.money'); if(bank){ bank.classList.remove('bump'); void bank.offsetWidth; bank.classList.add('bump'); } }
    else Sound.coin();
    if(!IS_TEST){ const r=rep; setTimeout(()=>{ if(SES && SES.rep===r && r.phase==='result') mathAfter(); }, newly?1500:(fast?750:1100)); }
  } else Sound.soft();
}
function mathAfter(){
  const rep=SES.rep; if(!rep || rep.phase!=='result') return;

}
function mathFix(){
  const rep=SES.rep, f=curItem();

  if(rep.fixTries>=3){ mathNext(); return; }

function mathNext(){
  SES.idx++;

  if(SES.idx>=SES.queue.length || timeUp) return endMath(true);

function lockMathCheck(f, rep, ok, fast, ms, idk){
  const c=S.math.checkCur;

function mathTick(){

function finishMathCheck(){
  const c=S.math.checkCur, t=today(), first=!deckChecked(c.deck);
  c.items.forEach(x=>{
    const st=fs(x.k);
    if(first){
      if(x.fs){ st.b=2; st.days=[t]; st.up=t; st.due=addDays(t,1); }
      else if(x.ok){ st.b=1; st.due=t; }
      else { st.b=0; st.due=''; }
    } else if(!x.ok){ st.b=1; st.due=t; }
  });
  const rec={t, deck:c.deck, total:c.items.length, ok:c.items.filter(x=>x.ok).length, fast:c.items.filter(x=>x.fs).length, items:c.items};
  (S.math.checks[c.deck]=S.math.checks[c.deck]||[]).push(rec);
  S.math.checkCur=null; save();
  const prev=(S.math.checks[c.deck]||[]).slice(-2)[0];
  SES={mode:'mcheckDone', deck:c.deck, rec, first, prev: prev!==rec ? prev : null};
  ui.screen='mcheckResults'; Sound.horn(); confetti(); render();
}
function endMath(full){
  if(!SES){ ui.screen='home'; render(); return; }
  if(SES.mode==='mathcheck'){ SES=null; ui.screen='home'; render(); return; }
  const t=today(), reps=SES.log.length, correct=SES.log.filter(x=>x.ok).length, fast=SES.log.filter(x=>x.fast).length;
  const extras=[];
  if(reps>0){
    if(S.streak.last!==t){ S.streak.days=(S.streak.last===addDays(t,-1))?S.streak.days+1:1; S.streak.last=t;
      if(S.streak.days%5===0){ const b=addMoney(S,S.settings.money.dayStreak5,'Day streak'); if(b>0){ SES.earned=cents(SES.earned+b); extras.push(S.streak.days+' days in a row: +'+fmt$(b)); } } }
    S.sessions.push({t, mode:'math', deck:SES.deck, mins:Math.max(1,Math.round((Date.now()-SES.start)/60000)), reps, correct, fast, earned:SES.earned, lost:0, full:full?1:0, bestStreak:SES.bestStreak});

    case 'forgot': ui.modal={type:'forgot', cb:ui.modal.cb, err:''}; render(); break;
    case 'forgotok': { const v=((document.getElementById('rec')||{}).value||'').trim().toUpperCase(); if(simpleHash(v)===S.settings.recoveryHash){ S.settings.pinHash=''; save(); requirePin(ui.modal.cb); } else { ui.modal.err='That code does not match.'; render(); } break; }
    case 'changepin': ui.modal={type:'setpin', cb:()=>{ render(); }}; render(); break;
    case 'savesettings': {
      document.querySelectorAll('[data-money]').forEach(i=>{ const v=Number(i.value); if(isFinite(v)&&v>=0) S.settings.money[i.dataset.money]=cents(v); });
      const num=(id,min,max,def)=>{ const v=Number((document.getElementById(id)||{}).value); return isFinite(v)? Math.min(max,Math.max(min,v)) : def; };
      S.settings.weeklyCap=num('set-cap',0,1000,10); S.settings.dailyLossCap=num('set-loss',0,100,0.5);
      S.settings.practiceReps=Math.round(num('set-reps',5,40,15)); S.settings.practiceMinutes=Math.round(num('set-min',3,30,10));
      const on=[]; document.querySelectorAll('[data-drill]').forEach(i=>on[Number(i.dataset.drill)]=i.checked);
      if(on.some(Boolean)) S.settings.drillsOn=on;
      save(); render(); const st=document.getElementById('setstatus'); if(st) st.textContent='Saved.'; break; }
    case 'resetmoney': S.settings.money=Object.assign({},DEFAULT_MONEY); save(); render(); break;
    case 'payout': { const amt=Number((document.getElementById('payamt')||{}).value), dt=(document.getElementById('paydate')||{}).value||today(); recordPayout(S,amt,dt); save(); render(); break; }
    case 'startcombine': ui.modal={type:'confirm', title:'Start a Combine?', text:'The player will do 27 words (Form '+nextForm()+'). Practice is paused until it is done.', ok:'Start', cb:()=>{ ui.coachOpen=false; startCombine(); }}; render(); break;
    case 'addoutside': { const t=(document.getElementById('odate')||{}).value||today(), n=((document.getElementById('onote')||{}).value||'').trim(); if(n){ S.outside.push({t,note:n}); S.outside.sort((a,b)=>a.t.localeCompare(b.t)); save(); render(); } break; }
    case 'deloutside': S.outside.splice(Number(ds.i),1); save(); render(); break;
    case 'addword': { const g=id=>((document.getElementById(id)||{}).value||'').trim();
      const c={w:g('cw-w'), d:Number(g('cw-d')), syl:g('cw-syl')||g('cw-w'), chunk:g('cw-chunk'), s:g('cw-s'), trick:g('cw-trick')};
      if(c.d===3) c.chunk=c.chunk||c.w;
      const err=validateCustom(c); if(err){ const e=document.getElementById('cwerr'); if(e) e.textContent=err; break; }
      S.custom.push(c); save(); render(); break; }
    case 'wf-d': ui.wf=Object.assign({d:'all',t:'all',q:''},ui.wf,{d:el.value}); render(); break;
    case 'wf-t': ui.wf=Object.assign({d:'all',t:'all',q:''},ui.wf,{t:el.value}); render(); break;
    case 'wf-q': ui.wf=Object.assign({d:'all',t:'all',q:''},ui.wf,{q:el.value}); render(); break;
    case 'delword': S.custom.splice(Number(ds.i),1); save(); render(); break;
    case 'copy': copyText(ds.target); break;
    case 'syncconnect': { const url=((document.getElementById('sync-url')||{}).value||'').trim(), key=((document.getElementById('sync-key')||{}).value||'').trim();
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !key){ ui.syncMsg='Paste the web app address (it starts with https://script.google.com/) and your family key.'; render(); break; }
      ui.syncMsg='Connecting…'; render();
      GSync.call({action:'load'}, {url,key}).then(()=>{ GSync.setCfg({url,key}); ui.syncMsg='Connected. This device now syncs.'; return GSync.init(); })
        .catch(err=>{ ui.syncMsg = /bad_key/.test(String(err&&err.message)) ? 'The family key does not match the one in the script.' : 'Could not reach the script. Check the address, and that it is deployed with access set to Anyone.'; render(); });
      break; }
    case 'join': ui.modal={type:'join', err:''}; render(); break;
    case 'joinok': { const key=((document.getElementById('joinkey')||{}).value||'').trim(); const watch=!!(document.getElementById('joinwatch')||{}).checked; if(!key){ ui.modal.err='Type the family key.'; render(); break; }
      ui.modal.err='Connecting…'; render();
      GSync.call({action:'load'}, {url:DEFAULT_SYNC_URL, key}).then(()=>{ GSync.setCfg({url:DEFAULT_SYNC_URL, key, watch}); ui.modal=null; return GSync.init(); })
        .catch(err=>{ if(!ui.modal) return; ui.modal.err = /bad_key/.test(String(err&&err.message)) ? 'That key does not match. Check with a parent.' : 'Could not connect. Check the internet and try again.'; render(); });
      break; }
    case 'syncnow': ui.syncMsg=''; GSync.init().then(()=>{ ui.syncMsg = GSync.status==='online' ? 'Synced.' : 'Could not sync right now.'; render(); }); break;
    case 'synclink': ui.syncLink=GSync.linkFor(false); ui.syncLinkWatch=false; render(); break;
    case 'synclinkwatch': ui.syncLink=GSync.linkFor(true); ui.syncLinkWatch=true; render(); break;
    case 'watchon': { const c=GSync.cfg(); if(c){ c.watch=true; GSync.setCfg(c); ui.coachOpen=false; GSync.init(); } break; }
    case 'watchoff': { const c=GSync.cfg(); if(c){ c.watch=false; GSync.setCfg(c); render(); } break; }
    case 'watchrefresh': GSync.init(); break;
    case 'syncoff': GSync.setCfg(null); GSync.status='off'; ui.syncLink=''; ui.syncMsg='Sync is off on this device. Data stays here.'; render(); break;
    case 'csv': download('reps-'+today()+'.csv', buildCSV()); break;
    case 'makebackup': ui.backupCode=Store.exportCode(S); S.lastBackup=today(); save(); ui.backupCode=Store.exportCode(S); render(); break;
    case 'restore': { const code=(document.getElementById('restore')||{}).value; try{ const ns=Store.importCode(code); ui.modal={type:'confirm', title:'Replace all data?', text:'This replaces everything on this device with the backup.', ok:'Replace', cb:()=>{ S=ns; save(); render(); }}; render(); }catch(err){ const e=document.getElementById('reserr'); if(e) e.textContent='That code did not work. Copy the whole code, starting with GSG1:'; } break; }
  }
}
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ Store.save(S); if(GSync.cfg()){ clearTimeout(GSync.timer); GSync.push(); } }
  else if(GSync.cfg() && !GSync.busyPlaying()) GSync.init();     // pick up play from the other device
});
setInterval(()=>{ if(GSync.watch() && !document.hidden && !ui.coachOpen) GSync.init(); }, 60000);   // parent phones refresh every minute

/* Test hooks (used by tests.html) */
window.GSG = {
  DRILLS, WORDS, FORMS, BANNED, DRILL4_ALLOWED, RANKS, DEFAULT_MONEY, DATA_VERSION, IS_TEST,
  Store, Speech, formOrder, norm, sentenceUses, addMoney, recordPayout, weekEarned, todayLost, freshState,
  buildPracticeQueue, buildBossQueue, combineStatus, practiceLocked, nextForm, buildCSV, weeklySummary, validateCustom, simpleHash,
  get S(){ return S; }, set S(v){ S=v; },
  get SES(){ return SES; }, get ui(){ return ui; },
  setNow(d){ _now = d; }, render, act, startPractice, startBoss, startCombine, doCheck, doLock, endSession, save,
  reload(){ S = Store.load(); render(); },
  Clips, voiceScore, Rec, Cloud, analyze, focusDrills, GSync, tierOf, Sound,
  MATH:{FACTS, FACT, DECKS, DECK_IDS, DEFAULT_MATH, gradeMath, makePrompt, strategy, buildMathQueue, startMath, startMathCheck, mathKey, mathSubmit, mathAfter, mathIdk, mathTick, nextRound, mathFix, endMath, factStatus, deckCounts, fget, deckFacts, mathWeek}
};

render();
Clips.open().then(()=>{ if(ui.coachOpen) render(); });
Cloud.init();
GSync.takeLink();
GSync.init();
})();
</script>
