<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reps: Quality Checks</title>
<style>
:root{--bg:#f6f7f4;--ink:#122033;--ok:#1f7a45;--bad:#c8553d;--line:#d5dccf}
@media (prefers-color-scheme: dark){:root{--bg:#0b131f;--ink:#eef2f7;--ok:#3cc177;--bad:#ef7a62;--line:#24354d}}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;max-width:900px}
h1{font-size:22px} li{margin:6px 0;padding:6px 8px;border-bottom:1px solid var(--line);list-style:none}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.detail{font-size:13px;opacity:.85;white-space:pre-wrap}
iframe{border:1px solid var(--line);width:100%;height:420px;margin-top:10px}
#phone{width:360px;height:640px}
</style>
</head>
<body>
<h1>Reps (spelling + math): Quality Checks</h1>
<p>These checks run in a separate test save, so the player's real data is never touched.</p>
<div id="summary" data-done="0">Running…</div>
<ul id="out"></ul>
<iframe id="game" src="index.html?test=1" title="game under test"></iframe>
<iframe id="phone" src="index.html?test=1" title="phone-size game"></iframe>
<script>
'use strict';
const out = document.getElementById('out');
const results = [];
function report(name, ok, detail){
  results.push({name, ok, detail});
  const li=document.createElement('li');
  li.innerHTML='<span class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+'</span> '+name+(detail?'<div class="detail">'+String(detail).replace(/</g,'&lt;')+'</div>':'');
  out.appendChild(li);
}
function waitLoad(fr){ return new Promise(r=>{ if(fr.contentWindow && fr.contentWindow.GSG) return r(); fr.addEventListener('load',()=>r(),{once:true}); }); }
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

/* The word lists from the master prompt (Drill 7 has no "piece": it lives in Look-Alikes) */
const EXPECTED = [
 'carried hurried worried copied replied emptied cities families babies easier happier funniest tiniest heaviest angrily busily emptiness laziness played enjoyed stayed carrying worrying',
 'hoping making writing smiling dancing saving giving closed arrived noticed believing amazing careful hopeful movement excitement lovely',
 'running stopped planning winning swimming getting shopping dropped hopping forgetting admitted preferred occurred controlled permitted',
 "their there they're your you're its it's to too two threw through whose who's then than know no hear here piece peace weather whether accept except",
 'distant distance instant elephant balance attendance absent absence silent silence patient confident confidence excellent student different nervous famous enormous jealous generous curious various animal natural final',
 'simple sample purple table middle bottle little puzzle gentle single handle castle people terrible possible',
 'brought bought fought though enough because said again believe minute answer laugh school beautiful favorite separate receive science Wednesday',
 'accident attention tomorrow opposite according recommend successful communicate commercial accomplish occasion opportunity environment government temperature experiment vocabulary comfortable',
 'impossible imperfect impatient immature imbalance incomplete independent incorrect invisible illegal irregular irresponsible'
];
const FORBIDDEN = [/\bIEP\b/, /\bdisabilit/i, /\bdeficit/i, /\bbehind\b/i, /\bstruggl/i, /\bweak/i, /special education/i];

async function main(){
  const fr = document.getElementById('game'), ph = document.getElementById('phone');
  await waitLoad(fr); await waitLoad(ph);
  const W = fr.contentWindow, G = W.GSG, D = fr.contentDocument;
  const reset = (opts)=>{ G.setNow(null); const s=G.freshState(); if(opts&&opts.onboarded) s.onboarded=true; G.S=s; G.save(); G.act('home'); W.document.querySelectorAll('.overlay').forEach(x=>x.remove()); G.ui.modal=null; G.ui.coachOpen=false; G.render(); return s; };
  const q = sel=>D.querySelector(sel);
  function answerCurrent(text){ const a=D.getElementById('ans'); a.value=text; a.dispatchEvent(new W.Event('input',{bubbles:true})); }
  function finishCombineWith(fn){ G.startCombine(); let guard=0; while(G.SES && G.SES.mode==='combine' && guard++<40){ const it=G.SES.queue[G.SES.idx]; answerCurrent(fn(it)); G.doCheck(); G.doLock(null); } }
  const allSentences = ()=>G.WORDS.map(x=>({s:x.s,own:x.w,d:x.d,src:'bank'})).concat(G.FORMS.A.concat(G.FORMS.B).map(x=>({s:x.s,own:x.w,d:x.d,src:'form'})));
  const wordsIn = s=>s.toLowerCase().replace(/’/g,"'").match(/[a-z']+/g)||[];

  // 1. Word bank
  try{
    const errs=[];
    G.WORDS.concat(G.FORMS.A, G.FORMS.B).forEach(x=>{
      if(x.syl.replace(/-/g,'').toLowerCase()!==x.w.toLowerCase()) errs.push(x.w+': syllables "'+x.syl+'"');
      if(x.w.toLowerCase().indexOf(x.chunk.toLowerCase())<0) errs.push(x.w+': chunk "'+x.chunk+'" not in word');
      if(x.s.split(/\s+/).filter(Boolean).length>8) errs.push(x.w+': sentence over 8 words');
      if(!G.sentenceUses(x.s,x.w)) errs.push(x.w+': sentence does not use the word');
    });
    EXPECTED.forEach((line,d)=>{
      const got=G.WORDS.filter(x=>x.d===d).map(x=>x.w.toLowerCase());
      line.split(' ').forEach(w=>{ if(got.indexOf(w.toLowerCase())<0) errs.push('Drill '+(d+1)+' is missing '+w); });
    });
    if(G.FORMS.A.length!==27||G.FORMS.B.length!==27) errs.push('Forms must have 27 words each');
    report('1. Every word has a matching sentence (8 words or fewer), a correct syllable split, a target chunk inside the word, and matches the prompt lists ('+G.WORDS.length+' practice words, 54 Combine words)', !errs.length, errs.join('\n'));
  }catch(e){ report('1. Word bank', false, e.stack); }

  // 2 + 10b. Banned words and Combine words
  try{
    const errs=[];
    const banned=G.BANNED.map(w=>w.toLowerCase());
    G.WORDS.forEach(x=>{ const w=x.w.toLowerCase(); if(banned.includes(w) && !(x.d===3 && G.DRILL4_ALLOWED.includes(w))) errs.push('banned practice word: '+x.w); });
    allSentences().forEach(o=>{ wordsIn(o.s).forEach(t=>{ if(banned.includes(t) && !(o.d===3 && o.own.toLowerCase()===t && G.DRILL4_ALLOWED.includes(t))) errs.push('banned word "'+t+'" in sentence: '+o.s); }); });
    const formWords=G.FORMS.A.concat(G.FORMS.B).filter(x=>x.d!==3).map(x=>x.w.toLowerCase());
    G.WORDS.forEach(x=>{ if(formWords.includes(x.w.toLowerCase())) errs.push('Combine word used in practice: '+x.w); wordsIn(x.s).forEach(t=>{ if(formWords.includes(t)) errs.push('Combine word "'+t+'" in practice sentence: '+x.s); }); });
    // Combine sentences must not reuse other Combine words either (Drill 4 excepted)
    G.FORMS.A.concat(G.FORMS.B).forEach(x=>{ wordsIn(x.s).forEach(t=>{ if(formWords.includes(t) && t!==x.w.toLowerCase()) errs.push('Combine word "'+t+'" inside another Combine sentence: '+x.s); }); });
    // Drill 4 sentences for their/you're/threw are not reused anywhere else
    const d4 = G.WORDS.filter(x=>x.d===3 && G.DRILL4_ALLOWED.includes(x.w.toLowerCase())).map(x=>x.s);
    G.WORDS.concat(G.FORMS.A,G.FORMS.B).filter(x=>!(x.d===3 && G.DRILL4_ALLOWED.includes(x.w.toLowerCase()))).forEach(x=>{ if(d4.includes(x.s)) errs.push('reused sentence: '+x.s); });
    reset({onboarded:true}); finishCombineWith(it=>it.w);
    for(let i=0;i<20;i++){ G.buildBossQueue().concat(G.buildPracticeQueue(null)).forEach(x=>{ if(formWords.includes(x.w.toLowerCase())) errs.push('Combine word in a queue: '+x.w); if(banned.includes(x.w.toLowerCase()) && x.d!==3) errs.push('banned word in a queue: '+x.w); }); }
    report('2 / 10b. No retest word outside Drill 4, no retest word in any sentence, and no Combine word in practice, Boss Battles or any sentence', !errs.length, errs.slice(0,20).join('\n'));
  }catch(e){ report('2. Banned words', false, e.stack); }

  // 3. Speech order and free replays
  try{
    const it=G.WORDS[0];
    const seq=G.Speech.textsFor(it);
    const okSeq = seq.length===3 && seq[0]===it.w && seq[1]===it.s && seq[2]===it.w;
    reset({onboarded:true}); finishCombineWith(i=>i.w);
    G.S.bank.wallet=1; G.save();
    G.startPractice(null);
    const before=JSON.stringify([G.S.bank, G.S.ledger.length]);
    for(let i=0;i<5;i++){ G.act('hearword'); G.act('hearsent'); }
    const after=JSON.stringify([G.S.bank, G.S.ledger.length]);
    report('3. Speech reads word, sentence, word; replays cost nothing', okSeq && before===after, 'sequence: '+seq.join(' | ')+(before!==after?'\nmoney changed on replay':''));
  }catch(e){ report('3. Speech', false, e.stack); }

  // 4. Lock only after Check
  try{
    reset({onboarded:true}); finishCombineWith(i=>i.w); G.startPractice(null);
    // skip chunk builder if present
    if(G.SES.rep.phase==='chunk'){ G.SES.rep.phase='spell'; G.render(); }
    const noLockBefore = !q('[data-act="lock"]');
    G.doLock(true);                                   // must be ignored
    const stillSpell = G.SES.rep.phase==='spell';
    answerCurrent('test'); G.doCheck();
    const lockAfter = !!q('[data-act="lock"]');
    report('4. "Lock it in" cannot be pressed until "Check it" has been pressed', noLockBefore && stillSpell && lockAfter, 'no lock before: '+noLockBefore+', ignored early lock: '+stillSpell+', lock after check: '+lockAfter);
  }catch(e){ report('4. Lock after check', false, e.stack); }

  // 5. Money rules
  try{
    const errs=[]; const s=reset({onboarded:true});
    const A=(amt,o)=>G.addMoney(G.S,amt,'test',o||{});
    A(0.10); if(G.S.bank.wallet!==0.10) errs.push('earn failed');
    A(0.10,{boss:true}); if(G.S.bank.wallet!==0.30) errs.push('boss double failed: '+G.S.bank.wallet);
    G.S.bank.wallet=0.03; A(-0.05); if(G.S.bank.wallet!==0) errs.push('$0 floor failed: '+G.S.bank.wallet);
    reset({onboarded:true}); G.S.bank.wallet=5; G.S.bank.vault=2;
    for(let i=0;i<10;i++) A(-0.10);
    if(G.todayLost(G.S)!==0.5) errs.push('daily loss cap failed: '+G.todayLost(G.S));
    if(G.S.bank.vault!==2) errs.push('vault changed on loss');
    reset({onboarded:true}); G.S.settings.weeklyCap=1;
    A(0.75); A(0.75); A(0.75,{vault:true});
    if(G.weekEarned(G.S)!==1) errs.push('weekly cap failed: '+G.weekEarned(G.S));
    reset({onboarded:true}); G.S.bank.wallet=3; G.S.bank.vault=4;
    G.recordPayout(G.S,5); if(G.S.bank.wallet!==0||G.S.bank.vault!==2) errs.push('payout order failed: '+JSON.stringify(G.S.bank));
    // play-through: the Vault never goes down during play, and the wallet never below 0
    reset({onboarded:true}); finishCombineWith(i=>'zzz'); const v0=G.S.bank.vault;
    G.startPractice(null); let guard=0, minWallet=99, vaultDropped=false;
    while(G.SES && G.SES.mode==='practice' && G.ui.screen==='rep' && guard++<80){
      const rep=G.SES.rep;
      if(rep.phase==='chunk'){ rep.phase='spell'; G.render(); }
      if(rep.phase==='spell'){ answerCurrent('qqq'); G.doCheck(); G.doLock(true); }
      else if(rep.phase==='result'){ G.act('next'); }
      else if(rep.phase==='fix'){ const w=G.SES.queue[G.SES.idx].w; answerCurrent(w); G.act('fix'); if(G.SES && G.SES.rep && G.SES.rep.phase==='fix'){ answerCurrent(w); G.act('fix'); } }
      minWallet=Math.min(minWallet,G.S.bank.wallet); if(G.S.bank.vault<v0) vaultDropped=true;
    }
    if(minWallet<0) errs.push('wallet below 0'); if(vaultDropped) errs.push('vault went down in play');
    if(G.todayLost(G.S)>G.S.settings.dailyLossCap+1e-9) errs.push('lost more than daily cap in play');
    report('5. Money rules: earn, Boss double, $0 floor, $0.50 daily loss cap, weekly cap, Vault never lost, payouts take Wallet first', !errs.length, errs.join('\n'));
  }catch(e){ report('5. Money', false, e.stack); }

  // 6. Persistence and migration
  try{
    const errs=[];
    reset({onboarded:true}); G.S.bank={wallet:4.2,vault:1.5}; G.S.records.bestBoss=7; G.save();
    G.S=G.freshState(); G.reload();
    if(G.S.bank.wallet!==4.2||G.S.bank.vault!==1.5||G.S.records.bestBoss!==7) errs.push('reload lost data');
    const m0=G.Store.migrate({bank:7.5});
    if(m0.bank.wallet!==7.5||m0.version!==G.DATA_VERSION) errs.push('v0 migrate lost bank');
    const m1=G.Store.migrate({version:1,bank:{wallet:2,vault:3},settings:{weeklyCap:5},drills:[{r:2}]});
    if(m1.bank.vault!==3||m1.settings.weeklyCap!==5||m1.drills.length!==9||m1.drills[0].r!==2||!m1.settings.money.correct) errs.push('v1 migrate failed');
    const code=G.Store.exportCode(G.S), back=G.Store.importCode(code);
    if(back.bank.wallet!==4.2) errs.push('backup code roundtrip failed');
    report('6. Data survives a reload and browser restart; old saves migrate without losing the bank', !errs.length, errs.join('\n'));
  }catch(e){ report('6. Persistence', false, e.stack); }

  // 7. Coach Room
  try{
    const errs=[];
    reset({onboarded:true}); G.S.settings.pinHash=G.simpleHash('1234'); G.save(); G.render();
    G.act('coach'); if(!q('#pin')) errs.push('no PIN prompt');
    q('#pin').value='0000'; G.act('pinok'); if(G.ui.coachOpen) errs.push('wrong PIN opened the Coach Room');
    q('#pin').value='1234'; G.act('pinok'); if(!G.ui.coachOpen) errs.push('right PIN did not open');
    G.ui.coachTab='settings'; G.render(); q('#set-cap').value='7'; q('[data-money="correct"]').value='0.20'; G.act('savesettings');
    if(G.S.settings.weeklyCap!==7||G.S.settings.money.correct!==0.2) errs.push('settings edit did not save');
    G.addMoney(G.S,0.1,'x'); G.S.reps.push({t:'2026-10-19',w:'carried',d:0,ok:1,h:0,c:0,m:'p',a:'carried'});
    const csv=G.buildCSV(); if(csv.split('\n').length<2||csv.indexOf('carried')<0) errs.push('CSV empty');
    G.ui.coachTab='data'; G.render(); G.act('makebackup'); const code=q('#backup').value;
    q('#restore').value=code; G.act('restore'); if(!q('.overlay')) errs.push('restore did not ask to confirm');
    G.act('confirmok'); if(G.S.settings.weeklyCap!==7) errs.push('restore failed');
    if(G.weeklySummary().split('\n').length!==5) errs.push('weekly summary is not 5 lines');
    G.act('coachclose');
    report('7. Coach Room needs the PIN; edits take effect; CSV builds; backup code restores; weekly summary has 5 lines (with math)', !errs.length, errs.join('\n'));
  }catch(e){ report('7. Coach Room', false, e.stack); }

  // 8. No forbidden words in the game
  try{
    const src = await (await fetch('index.html',{cache:'no-store'})).text();
    const hits = FORBIDDEN.filter(re=>re.test(src)).map(String);
    // also check rendered player screens
    reset(); const texts=[]; texts.push(D.body.innerText);
    G.act('welnext'); texts.push(D.body.innerText); G.act('welnext'); texts.push(D.body.innerText);
    G.act('welgo'); texts.push(D.body.innerText);
    finishCombineWith(i=>i.w); texts.push(D.body.innerText); G.act('home'); texts.push(D.body.innerText);
    G.startPractice(null); texts.push(D.body.innerText);
    const hits2 = FORBIDDEN.filter(re=>texts.some(t=>re.test(t))).map(String);
    report('8. No forbidden words (IEP, disability, deficit, behind, struggle, weak, special education) anywhere in the game', !hits.length && !hits2.length, hits.concat(hits2).join(', '));
  }catch(e){ report('8. Forbidden words', false, e.stack); }

  // 9. Phone size
  try{
    const PW=ph.contentWindow, PG=PW.GSG, PD=ph.contentDocument;
    const errs=[];
    const chk=(label)=>{ const sw=PD.documentElement.scrollWidth, cw=PD.documentElement.clientWidth; if(sw>cw+1) errs.push(label+': '+sw+' > '+cw); };
    PG.setNow(null); let s=PG.freshState(); PG.S=s; PG.save(); PG.render(); chk('welcome');
    s.onboarded=true; PG.render(); chk('home before Combine');
    PG.startCombine(); chk('Combine word');
    let guard=0; while(PG.SES && PG.SES.mode==='combine' && guard++<40){ const it=PG.SES.queue[PG.SES.idx]; const a=PD.getElementById('ans'); a.value=it.w; a.dispatchEvent(new PW.Event('input',{bubbles:true})); PG.doCheck(); if(guard===2) chk('Pre-Game Check'); PG.doLock(null); }
    chk('Combine results'); PG.act('home'); chk('home');
    PG.startPractice(null); chk('practice rep');
    const a=PD.getElementById('ans'); if(a){ a.value='wrongspelling'; PG.doCheck(); PG.doLock(false); chk('result with letter compare'); }
    PG.S.settings.pinHash=PG.simpleHash('1111'); PG.ui.coachOpen=true; ['progress','benchmark','voice','money','settings','words','data'].forEach(t=>{ PG.ui.coachTab=t; PG.render(); chk('Coach '+t); });
    PG.ui.coachOpen=false; PG.render();
    report('9. Works on a phone-size screen (360px) with no sideways scrolling', !errs.length, errs.join('\n'));
  }catch(e){ report('9. Phone size', false, e.stack); }

  // 10a. Combine rules
  try{
    const errs=[];
    reset({onboarded:true});
    if(!G.practiceLocked()) errs.push('practice not locked before first Combine');
    G.startPractice(null); if(G.SES && G.SES.mode==='practice') errs.push('practice started before Combine');
    G.S.bank.wallet=2; G.save();
    G.startCombine();
    const first=G.SES.queue.map(x=>x.w);
    for(let i=1;i<first.length;i++){ if(G.SES.queue[i].d===G.SES.queue[i-1].d) errs.push('two words in a row from one drill'); }
    if(q('[data-act="hint"]')) errs.push('hint button in Combine');
    if(q('.tiles')) errs.push('Chunk Builder in Combine');
    answerCurrent('wrongword'); G.doCheck();
    if(q('[data-sure="1"]')) errs.push('confidence call in Combine');
    G.doLock(null);
    if(G.SES.rep.phase==='result'||q('.result')) errs.push('feedback shown in Combine');
    if(G.S.bank.wallet!==2) errs.push('money changed on a wrong Combine answer');
    const saved=JSON.parse(W.localStorage.getItem('gsg.test.save'));
    if(!saved.combineCur||saved.combineCur.idx!==1||saved.combineCur.items.length!==1) errs.push('not saved after the word');
    // pause and resume
    G.act('pausecombine'); G.startCombine(); if(G.SES.idx!==1) errs.push('resume did not continue at word 2');
    let guard=0; while(G.SES && G.SES.mode==='combine' && guard++<40){ answerCurrent('zz'); G.doCheck(); G.doLock(null); }
    if(G.S.bank.wallet!==2) errs.push('money lost during Combine');
    if(G.S.bank.vault!==1) errs.push('finish bonus not in Vault: '+G.S.bank.vault);
    if(G.practiceLocked()) errs.push('practice still locked after Combine');
    report('10a. Practice is locked until the first Combine; the Combine gives no hints, feedback or confidence call, never takes money, and saves after every word', !errs.length, errs.join('\n'));
  }catch(e){ report('10a. Combine', false, e.stack); }

  // 10c. Re-tests alternate forms every 28 days, Benchmark shows each one
  try{
    const errs=[];
    reset({onboarded:true});
    const day0='2026-10-19';
    G.setNow(new Date(2026,9,19,16,0));
    finishCombineWith(it=>it.d<3?it.w:'x');
    if(G.S.combines[0].form!=='A') errs.push('first form not A');
    if(G.S.drills[0].r!==1) errs.push('3/3 drill did not start at JV');
    if(G.S.drills[5].r!==0||!G.S.drills[5].chunk) errs.push('0/3 drill did not start at Rookie with Chunk Builder');
    G.setNow(new Date(2026,10,10,16,0)); if(G.combineStatus().need) errs.push('Combine due too early');
    G.setNow(new Date(2026,10,16,16,0)); const st=G.combineStatus(); if(!st.need||st.locked) errs.push('day 28 should show Combine Day but not lock');
    G.setNow(new Date(2026,10,19,16,0)); if(!G.combineStatus().locked) errs.push('day 31 should lock practice');
    const v=G.S.bank.vault;
    finishCombineWith(it=>it.d<5?it.w:'x');
    if(G.S.combines[1].form!=='B') errs.push('second form not B');
    if(Math.abs(G.S.bank.vault-(v+1+0.25*2))>1e-9) errs.push('re-test pay wrong: '+(G.S.bank.vault-v));
    if(G.nextForm()!=='A') errs.push('third form not A');
    G.S.settings.pinHash=G.simpleHash('1234'); G.ui.coachOpen=true; G.ui.coachTab='benchmark'; G.render();
    const txt=D.body.innerText;
    if(!(txt.indexOf('Form A')>=0 && txt.indexOf('Form B')>=0 && txt.indexOf('He wrote')>=0 && txt.indexOf('/27')>=0 && q('svg'))) errs.push('Benchmark Report missing baseline, re-test or chart');
    G.ui.coachOpen=false; G.setNow(null); G.render();
    report('10c. Re-tests alternate Form A and B every 28 days (locks after 3 more days); Benchmark Report shows baseline vs every re-test', !errs.length, errs.join('\n'));
  }catch(e){ report('10c. Re-tests', false, e.stack); }

  // Levels: every drill has Warm-ups; practice opens with Warm-ups, never two Big plays in a row; a miss brings a Warm-up next
  try{
    const errs=[];
    for(let d=0;d<9;d++){ const e=G.WORDS.filter(x=>x.d===d && G.tierOf(x)==='e').length; if(e<4) errs.push('Drill '+(d+1)+' has only '+e+' Warm-up words'); }
    reset({onboarded:true}); finishCombineWith(i=>i.w);
    for(let k=0;k<30;k++){
      const q=G.buildPracticeQueue(null); const t=q.map(G.tierOf);
      if(t[0]!=='e'||t[1]!=='e') { errs.push('practice did not open with two Warm-ups: '+t.join('')); break; }
      if(/hh/.test(t.join(''))) { errs.push('two Big plays in a row: '+t.join('')); break; }
      if(t.filter(x=>x==='e').length<5) { errs.push('too few Warm-ups at Rookie: '+t.join('')); break; }
      if(new Set(q.map(x=>x.w)).size!==q.length) { errs.push('duplicate word in a practice'); break; }
    }
    G.startPractice(null); let guard=0, checked=0;
    while(G.SES && G.SES.mode==='practice' && guard++<60 && checked<3){
      const rep=G.SES.rep;
      if(rep.phase==='chunk'){ rep.phase='spell'; G.render(); }
      if(rep.phase==='spell'){ const it=G.SES.queue[G.SES.idx]; answerCurrent('zzzz'); G.doCheck(); G.doLock(false);

  try{
    const errs=[]; reset({onboarded:true});
    G.act('sport', {dataset:{s:'math'}});
    if(D.body.innerText.indexOf('Math Reps')<0) errs.push('math home not shown');
    if(!D.querySelector('[data-act="mcheck"][data-deck="mul"]')) errs.push('no Speed Check button for times');
    if(D.querySelectorAll('.deck').length!==3) errs.push('expected 3 deck cards');
    runCheck('mul', (f,pr)=>pr.ans); G.act('home');
    if(!D.querySelector('.fgrid')) errs.push('no times chart after Speed Check');
    M.startMath('mul');
    ['1','2','del','5'].forEach(k=>G.act('key',{dataset:{k}}));
    if(G.SES.rep.ans!=='15' || D.getElementById('mans').textContent!=='15') errs.push('keypad typing wrong: '+G.SES.rep.ans);
    G.SES.rep.ans=''; W.document.dispatchEvent(new W.KeyboardEvent('keydown',{key:'4',bubbles:true})); W.document.dispatchEvent(new W.KeyboardEvent('keydown',{key:'2',bubbles:true}));
    if(G.SES.rep.ans!=='42') errs.push('computer keyboard digits not taken');
    answerMath(ansOf());
    G.act('mend'); G.act('confirmok'); G.act('home');
    G.act('sport', {dataset:{s:'spelling'}});
    if(!D.querySelector('[data-act="practice"]') && !D.querySelector('[data-act="combine"]')) errs.push('spelling home missing after switching back');
    // Coach Room math tab + CSV + summary; spelling stats ignore math sessions
    G.S.settings.pinHash=G.simpleHash('1234'); G.ui.coachOpen=true; G.ui.coachTab='math'; G.render();
    ['How Math Reps works','Times chart','Math settings','Speed Check history'].forEach(t=>{ if(D.body.innerText.indexOf(t)<0) errs.push('coach Math tab missing "'+t+'"'); });
    G.ui.coachOpen=false; G.render();
    if(G.buildCSV().indexOf('\nmath,')<0) errs.push('CSV has no math rows');
    if(G.weeklySummary().indexOf('Math facts:')<0) errs.push('weekly summary has no math line');
    const txt=(G.S.sessions.filter(x=>x.mode==='math').length);
    if(!txt) errs.push('no math session to compare');
    // forbidden words on math screens
    G.act('sport', {dataset:{s:'math'}}); const homeTxt=D.body.innerText; M.startMath('mul'); answerMath('1'); const repTxt=D.body.innerText; G.act('mend'); G.act('confirmok'); G.act('home');
    FORBIDDEN.forEach(re=>{ if(re.test(homeTxt)||re.test(repTxt)) errs.push('math screen uses '+re); });
    report('Math 6. Spelling / Math switch; keypad and computer keyboard; Coach Room Math tab; CSV and weekly summary include math; no labels on Graham\'s screens', !errs.length, errs.join('\n'));
  }catch(e){ report('Math 6. Screens', false, e.stack); }

  try{
    const errs=[]; const P=ph.contentWindow, PG=P.GSG, PD=ph.contentDocument;
    PG.setNow(null); const s=PG.freshState(); s.onboarded=true; PG.S=s; PG.save(); PG.act('sport',{dataset:{s:'math'}});
    const chk=(where)=>{ const sw=PD.documentElement.scrollWidth, cw=PD.documentElement.clientWidth; if(sw>cw+1) errs.push(where+': sideways scroll ('+sw+' > '+cw+')'); };
    chk('math home'); PG.MATH.startMathCheck('mul'); chk('speed check');
    let g=0; while(PG.SES && PG.SES.mode==='mathcheck' && g++<80){ PG.SES.rep.ans=PG.SES.rep.pr.ans; PG.SES.rep.t0=P.performance.now(); PG.MATH.mathSubmit(); }
    chk('check results'); PG.act('home'); chk('math home with chart');
    PG.MATH.startMath('mul'); chk('practice'); PG.SES.rep.ans='1'; PG.MATH.mathSubmit(); chk('miss with dot picture');
    PG.act('mend'); PG.act('confirmok'); chk('final'); PG.act('home');
    const s2=PG.freshState(); PG.S=s2; PG.save(); PG.act('sport',{dataset:{s:'spelling'}});
    report('Math 7. Phone size (360 px): no sideways scrolling on any math screen', !errs.length, errs.join('\n'));
  }catch(e){ report('Math 7. Phone size', false, e.stack); }

  try{
    const errs=[]; reset({onboarded:true}); G.act('sport',{dataset:{s:'math'}});
    M.startMathCheck('fdp');
    if(!D.getElementById('mclock') || !/⏱ [01]:\d\d/.test(D.getElementById('mclock').textContent)) errs.push('no round clock on the Speed Check');
    if(!D.querySelector('[data-act="midk"]')) errs.push('no I don\'t know button');
    const f0=G.SES.queue[0].k; G.act('midk');
    const it=G.S.math.checkCur.items[0]; if(!it || it.k!==f0 || it.ok || !it.idk) errs.push('I don\'t know did not record a skip');
    if(G.SES.idx!==1) errs.push('I don\'t know did not move on');
    answerMath('1');                                        // one more answered this round
    const before=G.S.math.checkCur.items.length, idxBefore=G.SES.idx;
    G.SES.roundStart=Date.now()-61000; M.mathTick();         // time runs out mid-fact
    if(!G.SES.rbreak || D.body.innerText.indexOf('Round 1 done')<0) errs.push('no break screen when the 60 seconds ran out');
    if(D.body.innerText.indexOf('2 facts')<0) errs.push('break screen does not show facts this round');
    if(G.S.math.checkCur.items.length!==before) errs.push('the fact on screen was counted when time ran out');
    G.SES.rep.ans='5'; M.mathSubmit(); if(G.S.math.checkCur.items.length!==before) errs.push('could answer during the break');
    G.act('mround');
    if(G.SES.rbreak || G.SES.round!==2 || G.SES.idx!==idxBefore) errs.push('next round did not resume at the same fact');
    if(G.settings && 0) errs.push('');
    let g=0; while(G.SES && G.SES.mode==='mathcheck' && g++<40) G.act('midk');
    if(G.ui.screen!=='mcheckResults') errs.push('check did not finish');
    if(G.S.math.checks.fdp[0].items.length!==14) errs.push('check did not cover all 14 facts');
    if(M.factStatus(f0)!=='new') errs.push('I don\'t know fact is not a training fact');
    if(D.body.innerText.indexOf('"I don\'t know"')<0) errs.push('results do not mention I don\'t know');
    report('Math 8. Speed Check runs in 60-second rounds with a break; time-out never counts the fact on screen; "I don\'t know" skips fast and becomes a training fact', !errs.length, errs.join('\n'));
  }catch(e){ report('Math 8. Rounds and I don\'t know', false, e.stack); }

  // Extra: Drill 4 shows the sentence with a blank; feedback order; fix rep
  try{
    const errs=[];
    reset({onboarded:true}); finishCombineWith(i=>i.w); G.startPractice(3);
    if(G.SES.rep.phase==='chunk'){ G.SES.rep.phase='spell'; G.render(); }
    const it=G.SES.queue[G.SES.idx]; const sent=q('.sentence');
    if(!sent||sent.textContent.indexOf('_____')<0) errs.push('Look-Alike sentence not shown with a blank');
    answerCurrent(it.w+'x'); G.doCheck(); G.doLock(false);
    if(!q('.diff')) errs.push('no letter-by-letter compare after a miss');
    G.act('next'); if(G.SES.rep.phase!=='fix') errs.push('no fix rep after a miss');
    report('Extra. Look-Alikes show the sentence with a blank; a miss shows the letter compare, then a fix rep', !errs.length, errs.join('\n'));
  }catch(e){ report('Extra. Look-Alikes', false, e.stack); }

  reset();
  const pass=results.filter(r=>r.ok).length, fail=results.length-pass;
  const sum=document.getElementById('summary');
  sum.textContent = pass+' passed, '+fail+' failed';
  sum.className = fail? 'fail':'pass';
  sum.dataset.done='1'; sum.dataset.pass=pass; sum.dataset.fail=fail;
}
main().catch(e=>{ report('Test runner crashed', false, e.stack); const s=document.getElementById('summary'); s.dataset.done='1'; s.dataset.fail='1'; s.textContent='Runner crashed'; });
</script>
